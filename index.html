<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task-03 | Tic-Tac-Toe</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Background decoration -->
    <div class="circle circle1"></div>
    <div class="circle circle2"></div>


    <!-- Main Container -->
    <div class="container">

        <!-- Header -->
        <header>
            <div class="task">Task-03</div>
            <div class="line"></div>

            <h1>Tic-Tac-Toe</h1>
            <p>Web Application</p>
        </header>


        <!-- Game Area -->
        <main>

            <div class="game-info">

                <h2>Tic-Tac-Toe</h2>

                <p id="status">
                    Player X's turn
                </p>

            </div>


            <!-- Mode Selection -->
            <div class="mode">

                <button id="playerMode" class="mode-btn active">
                    2 Players
                </button>

                <button id="aiMode" class="mode-btn">
                    Play vs AI
                </button>

            </div>


            <!-- Scoreboard -->
            <div class="scoreboard">

                <div class="score">
                    <span>Player X</span>
                    <strong id="scoreX">0</strong>
                </div>

                <div class="score">
                    <span>Draws</span>
                    <strong id="scoreDraw">0</strong>
                </div>

                <div class="score">
                    <span>Player O</span>
                    <strong id="scoreO">0</strong>
                </div>

            </div>


            <!-- Tic Tac Toe Board -->
            <div class="board" id="board">

                <button class="cell" data-index="0"></button>
                <button class="cell" data-index="1"></button>
                <button class="cell" data-index="2"></button>

                <button class="cell" data-index="3"></button>
                <button class="cell" data-index="4"></button>
                <button class="cell" data-index="5"></button>

                <button class="cell" data-index="6"></button>
                <button class="cell" data-index="7"></button>
                <button class="cell" data-index="8"></button>

            </div>


            <!-- Restart -->
            <button id="restartBtn" class="restart">
                Restart Game
            </button>

        </main>


        <!-- Footer -->
        <footer>
            PRODIGY INFOTECH
        </footer>

    </div>


    <script src="script.js"></script>

</body>
</html>
